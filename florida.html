  return `<svg class="chart spec" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* Trend + season fit, residual scatter.  Decimal-year x so the single-year
   record still shows a slope; the fitted line is the seasonal model plus the
   trend, the dashed line is the trend alone. */
function decompositionChart(values, periods, fit){
  const n=values.length;
  const seen=[];
  for(let i=0;i<n;i++) if(isFinite(values[i])) seen.push(i);
  if(!n||!seen.length) return '<div style="color:var(--muted)">no observations</div>';
  const W=400, PL=43, PR=10, PT=12, PB=31, H=164;
  const pool=seen.map(i=>values[i]);
  if(fit) for(let i=0;i<n;i++) if(isFinite(fit.fitted[i])) pool.push(fit.fitted[i]);
  let lo=Math.min(...pool), hi=Math.max(...pool);
  if(hi-lo<1e-6){ lo-=0.02; hi+=0.02; }
  const pad=(hi-lo)*0.10, ylo=lo-pad, yhi=hi+pad;
  const X=i=>PL+(n>1?i/(n-1):0)*(W-PL-PR);
  const Y=v=>PT+(yhi-v)/(yhi-ylo)*(H-PT-PB);
  const time=periods.map(periodTime);
  const multiYear=new Set(periods.map(p=>p.year)).size>1;
  let g='';
  for(let i=0;i<=4;i++){
    const v=ylo+(yhi-ylo)*i/4, y=Y(v);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#2a3040"/>`;
    g+=`<text x="${PL-4}" y="${(y+3).toFixed(1)}" fill="#98a2b8" font-size="8" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  const stride=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=stride){
    const label=multiYear?periods[i].date.slice(2,7):periods[i].date.slice(5);
    g+=`<text x="${X(i).toFixed(1)}" y="${H-PB+12}" fill="#98a2b8" font-size="7.3" text-anchor="middle">${label}</text>`;
  }
  if((n-1)%stride){
    const i=n-1, label=multiYear?periods[i].date.slice(2,7):periods[i].date.slice(5);
    g+=`<text x="${X(i).toFixed(1)}" y="${H-PB+12}" fill="#98a2b8" font-size="7.3" text-anchor="middle">${label}</text>`;
  }

  let fitted='', trend='';
  for(let i=0;i<n;i++){
    const f=fit.fitted[i];
    if(!isFinite(f)) continue;
    fitted+=(fitted?' L':'M')+X(i).toFixed(1)+' '+Y(f).toFixed(1);
    const t=fit.beta[0]+fit.beta[1]*(fit.times[i]-fit.my);
    trend+=(trend?' L':'M')+X(i).toFixed(1)+' '+Y(t).toFixed(1);
  }
  g+=`<path d="${trend}" fill="none" stroke="#d08adf" stroke-width="1.1"
        stroke-dasharray="4 3" opacity="0.95"/>`;
  g+=`<path d="${fitted}" fill="none" stroke="#7fd4c1" stroke-width="1.6" opacity="0.95"/>`;

  for(let i=0;i<n;i++){
    const v=values[i];
    if(!isFinite(v)) continue;
    const z=isFinite(fit.sigma)&&fit.sigma>1e-12?Math.abs(v-fit.fitted[i])/fit.sigma:0;
    const out=z>3;
    g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${out?2.8:2.1}"
          fill="${out?'#ef8354':'#cdd6e6'}" stroke="#12141a" stroke-width="0.6">
          <title>${periods[i].date} · observed ${fmt(v,4)} · fitted ${fmt(fit.fitted[i],4)}${out?` · residual ${z.toFixed(1)}σ`:''}</title></circle>`;
    if(out)
      g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="5.4"
            fill="none" stroke="#ef8354" stroke-width="0.8" opacity="0.7"/>`;
  }
  if(fit.anomIdx>=0 && isFinite(values[fit.anomIdx])){
    const x=X(fit.anomIdx), y=Y(values[fit.anomIdx]);
    g+=`<line x1="${x.toFixed(1)}" y1="${(y-8).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y-13).toFixed(1)}"
          stroke="#ef8354" stroke-width="1"/>
        <text x="${x.toFixed(1)}" y="${(y-16).toFixed(1)}" fill="#ef8354" font-size="7.5"
          text-anchor="middle">${fit.anom.toFixed(1)}σ</text>`;
  }
  if(S.periodIdx>=0 && S.periodIdx<n)
    g+=`<line x1="${X(S.periodIdx).toFixed(1)}" y1="${PT}" x2="${X(S.periodIdx).toFixed(1)}"
          y2="${H-PB}" stroke="#fff" stroke-width="0.9" opacity="0.55" stroke-dasharray="2 3"/>`;

  return `<svg class="chart decomp" viewBox="0 0 ${W} ${H}">${g}</svg>
    <div class="chartkey">
      <span><i style="background:#cdd6e6"></i>observed</span>
      <span><i style="background:#7fd4c1"></i>seasonal fit</span>
      <span><i style="background:#d08adf"></i>trend</span>
      <span><i style="background:#ef8354"></i>residual &gt;3&sigma;</span>
    </div>`;
}

/* ---------------------------------------------------------------- controls */
function bind(){
  $('#resmode').onchange=e=>{
    S.resMode=e.target.value;
    applyResMode();
    if(S.resMode!=='overview') loadVisibleShards();
    recolor();
    buildLegend(); syncURL();
  };
  $('#season').onchange=e=>{ S.season=e.target.value; buildTimeline(); recolor(); syncURL(); };
  $('#changemetric').onchange=e=>{ S.changeMetric=e.target.value; recolor(); buildLegend(); syncURL(); };
  $('#opacity').oninput=e=>{
    S.opacity=Number(e.target.value);
    if(S.map&&S.map.getLayer('ov-fill')) S.map.setPaintProperty('ov-fill','fill-opacity',S.opacity/100);
    if(S.map&&S.map.getLayer('rg-fill')) S.map.setPaintProperty('rg-fill','fill-opacity',S.opacity/100);
  };
  $('#baseline').onchange=e=>{ S.baselineIdx=Number(e.target.value); recolor(); buildLegend(); syncURL(); };
  $('#basemap').onclick=()=>{
    S.satellite=!S.satellite;
    const b=$('#basemap');
    b.classList.toggle('on',S.satellite);
    b.textContent=S.satellite?'on':'off';
    if(S.map&&S.map.getLayer('basemap'))
      S.map.setLayoutProperty('basemap','visibility',S.satellite?'visible':'none');
  };
  $('#play').onclick=togglePlay;
  $('#speed').onchange=e=>{ S.speed=Number(e.target.value); if(S.playing) togglePlay(), togglePlay(); };
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    else if(e.key==='ArrowLeft'){ setPeriod(S.periodIdx-1); }
    else if(e.key==='ArrowRight'){ setPeriod(S.periodIdx+1); }
    else if(e.key==='Escape'){ closeInsp(); }
  });
}

/* ---------------------------------------------------------------- url state */
function applyURLState(){
  const res=PARAMS.get('res');
  const resMode = res==='both' ? 'regions' : res;
  if(resMode&&['overview','regions'].includes(resMode)){
    S.resMode=resMode; $('#resmode').value=resMode;
  }
  const mode=PARAMS.get('mode');
  if(mode&&[...$('#colormode').options].some(o=>o.value===mode)){
    S.mode=mode; $('#colormode').value=mode;
  }
  const metric=PARAMS.get('metric');
  if(metric&&['date','magnitude','score'].includes(metric)){
    S.changeMetric=metric; $('#changemetric').value=metric;
  }
  const idx=PARAMS.get('idx');
  if(idx && [...$('#analysisidx').options].some(o=>o.value===idx)){
    S.analysisIdx=idx; $('#analysisidx').value=idx;
  }
  const season=PARAMS.get('season');
  if(season&&['all','wet','dry'].includes(season)){
    S.season=season; $('#season').value=season;
  }
  const bin=PARAMS.get('bin');
  const binIdx=bin==null?-1:S.periods.findIndex(p=>String(p.bin)===bin);
  S.periodIdx=binIdx>=0?binIdx:S.periods.length-1;
  const base=PARAMS.get('baseline');
  const baseIdx=base==null?-1:S.periods.findIndex(p=>String(p.bin)===base);
  S.baselineIdx=baseIdx>=0?baseIdx:0;
  const op=Number(PARAMS.get('opacity'));
  if(isFinite(op)&&op>=15&&op<=100){
    S.opacity=op; $('#opacity').value=String(op);
  }
  updateModeControls();
  const cell=PARAMS.get('cell');
  if(cell) S.pendingSelect=cell;
}

function syncURL(){
  if(!S.manifest||!S.entry) return;
  const q=new URLSearchParams();
  q.set('catalog',CATALOG_URL);
  q.set('year',String(S.entry.year));
  if(S.periods[S.periodIdx]) q.set('bin',String(S.periods[S.periodIdx].bin));
  if(S.periods[S.baselineIdx]) q.set('baseline',String(S.periods[S.baselineIdx].bin));
  q.set('res',S.resMode);
  q.set('mode',S.mode);
  if(S.mode==='change') q.set('metric',S.changeMetric);
  if(isAnalysisMode()) q.set('idx',S.analysisIdx);
  if(S.season!=='all') q.set('season',S.season);
  if(S.opacity!==85) q.set('opacity',String(S.opacity));
  if(S.selected) q.set('cell',S.selected);
  const url=location.pathname+'?'+q.toString();
  history.replaceState(null,'',url);
}

function buildBaselineOptions(){
  const sel=$('#baseline'); sel.innerHTML='';
  S.periods.forEach((p,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=`${p.date} (bin ${p.bin})`;
    sel.appendChild(o);
  });
  sel.value=S.baselineIdx;
}
function togglePlay(){
  S.playing=!S.playing;
  $('#play').innerHTML=S.playing?'&#10073;&#10073;':'&#9654;';
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  if(S.playing){
    S.timer=setInterval(()=>{
      const sh=shownPeriods();
      if(!sh.length) return;
      const i=sh.findIndex(p=>p.bin===S.periods[S.periodIdx].bin);
      const nxt=sh[(i+1)%sh.length];
      setPeriod(S.periods.indexOf(nxt));
    },S.speed);
  }
}
function setLoading(msg){ $('#loading').innerHTML=`<div>${msg}</div><div class="bar2"><div></div></div>`; }
function hideLoading(){ const el=$('#loading'); if(el) el.style.display='none'; }
function failLoading(err){
  $('#loading').innerHTML=`<div style="max-width:560px;text-align:center;line-height:1.7">
    <div style="color:#e0a458;font-size:15px;margin-bottom:8px">could not load the regional bundle</div>
    <div>${err.message}</div></div>`;
}
function syncPanelTop(){
  const bar=$('#bar');
  if(!bar) return;
  const h=bar.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--paneltop',(h+10)+'px');
}

bind();
window.addEventListener('resize',syncPanelTop);
syncPanelTop();
boot();
</script>

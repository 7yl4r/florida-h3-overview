name: Deploy viewer to GitHub Pages

# Publishes the static viewer shell (viewer/florida.html) to GitHub Pages.
# data/ is gitignored and local-only, so the deployed viewer is a shell: it
# shows "import a product first" until a catalog URL is supplied, e.g.
#   https://<user>.github.io/florida-h3-overview/florida.html?catalog=<hosted catalog>&year=2017

# Publishing is done locally by `make deploy`, which pushes to the gh-pages
# branch. This workflow is kept only for manual runs from the Actions tab; it no
# longer triggers on push, so a broken Pages action cannot block the deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest h3 shapely pyproj numpy rasterio

      - name: Validate before deploy (make deploy)
        run: make deploy

      - name: Stage viewer bundle
        run: |
          rm -rf dist
          mkdir -p dist
          cp viewer/florida.html dist/florida.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment

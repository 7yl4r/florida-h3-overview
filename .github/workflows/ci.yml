name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest h3 shapely pyproj numpy rasterio

      - name: Compile Python modules
        run: |
          python -m py_compile src/florida_h3/*.py tools/*.py

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest tests/ -q

      - name: Check viewer JavaScript syntax
        run: |
          python -c "import re,pathlib; html=pathlib.Path('viewer/florida.html').read_text(); body=re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)[1][1]; pathlib.Path('/tmp/viewer.js').write_text(body)"
          node --check /tmp/viewer.js
